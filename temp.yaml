apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-deployment
  namespace: log-anomaly

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prediction-service

  template:
    metadata:
      labels:
        app: prediction-service

    spec:

      initContainers:
      - name: seed-models
        image: preet1018/prediction-service:latest
        imagePullPolicy: Always
        command: ['sh', '-c', 'cp -n /app/models/* /target-models/ || true']
        volumeMounts:
        - name: models-storage
          mountPath: /target-models

      containers:
      - name: prediction-service

        image: preet1018/prediction-service:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        env:
        - name: PROJECT_ROOT
          value: "/app"

        - name: MONGO_URI
          value: "mongodb://admin:admin@mongodb:27017/logs_db?authSource=admin"

        volumeMounts:
        - name: models-storage
          mountPath: /app/models

        readinessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: models-storage
        persistentVolumeClaim:
          claimName: models-pvc

---
apiVersion: v1
kind: Service

metadata:
  name: prediction-service
  namespace: log-anomaly

spec:
  selector:
    app: prediction-service

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000