---
- hosts: master
  become: no

  # These variables are expected to be passed from Jenkins via -e flags (e.g., -e frontend_tag=a1b2c3d)
  # We set defaults here to 'latest' just in case they aren't provided.
  vars:
    prediction_tag: "latest"
    drift_tag: "latest"
    frontend_tag: "latest"

  tasks:
    - name: Debug Kubernetes Connection
      shell: |
        whoami
        kubectl config current-context
        kubectl cluster-info
        kubectl get nodes
    
    # 1. Apply base infrastructure that doesn't need templating
    - name: "Ensure Namespace, Volumes, and MongoDB exist"
      command: kubectl apply -f ../Kubernetes/{{ item }} --validate=false
      loop:
        - namespace.yaml
        - volumes.yaml
        - mongodb.yaml

    # 2. Template the dynamic K8s manifests using the tags provided by Jenkins
    - name: "Update Kubernetes manifests with latest Prediction tag"
      template:
        src: "../Kubernetes/prediction-service.yaml.j2"
        dest: "/tmp/prediction-service.yaml"

    - name: "Update Kubernetes manifests with latest Drift tag"
      template:
        src: "../Kubernetes/drift-service.yaml.j2"
        dest: "/tmp/drift-service.yaml"

    - name: "Update Kubernetes manifests with latest Frontend tag"
      template:
        src: "../Kubernetes/frontend.yaml.j2"
        dest: "/tmp/frontend-deployment.yaml"

    # 3. Apply the templated manifests
    - name: "Apply Prediction Deployment"
      command: kubectl apply -f /tmp/prediction-service.yaml --validate=false

    - name: "Apply Drift Deployment"
      command: kubectl apply -f /tmp/drift-service.yaml --validate=false

    - name: "Apply Frontend Deployment"
      command: kubectl apply -f /tmp/frontend-deployment.yaml --validate=false

    # 4. Verify the zero-downtime rolling update succeeds
    - name: "Verify Rollout Status (Prediction Service)"
      command: kubectl rollout status deployment/prediction-deployment -n log-anomaly --timeout=180s

    - name: "Verify Rollout Status (Drift Service)"
      command: kubectl rollout status deployment/drift-deployment -n log-anomaly --timeout=180s

    - name: "Verify Rollout Status (Frontend)"
      command: kubectl rollout status deployment/frontend-deployment -n log-anomaly --timeout=180s

    - name: "Deployment Completed"
      debug:
        msg: "Kubernetes deployment updated successfully for all services!"
